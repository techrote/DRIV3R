name: DRIV3R source smoke
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax check (no models downloaded or trained)
        run: python3 -m compileall -q experiments/driv3r experiments/agent_painter scripts
      - name: Verify no automatic experiment workflows
        run: |
          if grep -R -n -E '(^[[:space:]]*schedule:|cron:)' .github/workflows; then
            echo 'DRIV3R research workflows must not schedule GPU/model training automatically.'
            exit 1
          fi
